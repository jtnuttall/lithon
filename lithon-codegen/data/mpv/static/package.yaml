name: mpv-bindgen-sys
version: 0.0.0.1
github: "jtnuttall/lithon/mpv-bindgen-sys"
license: BSD-3-Clause
license-file:
  - LICENSE
  - LICENSE_libmpv
  - LICENSE_hs-bindgen-runtime
  - LICENSE_c-expr-runtime
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "(c) 2026 Jeremy Nuttall"
category: Media
tested-with: GHC == 9.8.* || == 9.10.* || == 9.12.* || == 9.14.*

synopsis: Complete libmpv bindings, raw + curated, generated by hs-bindgen
description: |
  Machine-generated low-level bindings to the whole libmpv client API
  (client, render, OpenGL render, and stream callback headers): the raw
  hs-bindgen output (@Mpv.Sys.Bindgen.*@) plus a curated @Mpv.Sys@ layer
  with per-function safe/unsafe FFI decisions and native Haskell scalars.
  libmpv's own header documentation rides along in the haddocks.

  A generated translation unit of C @_Static_assert@s checks the baked
  layouts against your installed libmpv at every build, so ABI divergence
  is a compile error rather than memory corruption.

  Supports 64-bit Linux, macOS, and Windows, with libmpv client API >= 2.0
  development headers present. See the README for a quick start, the
  licensing note (libmpv itself is GPLv2+ by default), and the list of
  deliberate omissions.

extra-doc-files:
  - README.md
  - CHANGELOG.md

language: GHC2021

flags:
  abi-assertions:
    description: |
      Verify the baked ABI layout against the system libmpv headers at build time
      via generated C static assertions (disable only to diagnose)
    manual: true
    default: true
  abi-assertions-exact:
    description: |
      Assert every sizeof exactly, including any union-member structs the default
      lets libmpv append to. For maintainers checking a newer libmpv; consumers
      should leave it off. Only has an effect together with abi-assertions.
    manual: true
    default: false
  strict-data:
    description: |
      Compile the generated modules with StrictData (strict fields on every generated
      record). Main library only; the vendored runtime keeps its upstream semantics.
      Disable if you need lazy fields.
    manual: true
    default: true
  strict:
    description: |
      EXPERIMENTAL: compile the generated modules with Strict.

      The emitted hs-bindgen code has not been audited for laziness dependence; main library only.

      NB: Implies StrictData (GHC semantics), so -f -strict-data does not undo strict fields.
    manual: true
    default: false
  optimize:
    description: |
      Build with -O2. Package ghc-options win over cabal's optimization setting, so use
      -f -optimize for faster iterative builds of this large package.
    manual: true
    default: true
  optimize-aggressively:
    description: |
      Build with expensive optimizations. Consider this the release build: slow, but paid once if
      caching is set up, so it may be worth it for artifacts you intend to ship.

      Currently: -O2 -fexpose-all-unfoldings -flate-specialise -flate-dmd-anal -fstg-lift-lams.
    manual: true
    default: false

# Vendored `hs-bindgen` runtime.
#
# Semantics-preserving flags like `optimize` flags are applied here.
# Semantics-wrecking flags like `strict` aren't.
#
# This is an internal, private package. The shim will be traded for
# a real dependency + re-export once hs-bindgen releases.
internal-libraries:
  bindgen-runtime:
    source-dirs: runtime
    default-extensions:
      - DataKinds
      - DefaultSignatures
      - DeriveAnyClass
      - DerivingStrategies
      - DerivingVia
      - FunctionalDependencies
      - LambdaCase
      - PatternSynonyms
      - RecordWildCards
      - RoleAnnotations
      - ScopedTypeVariables
      - TypeFamilies
      - UndecidableInstances
      - ViewPatterns
    dependencies:
      - base >=4.17 && <4.23
      - bytestring >=0.11 && <0.13
      - containers >=0.6 && <0.9
      - primitive >=0.9 && <0.10
      - record-hasfield >=1.0 && <2
      - template-haskell >=2.19 && <2.25
      - vector >=0.13 && <0.14
    build-tools:
      - hsc2hs:hsc2hs
    when:
      - condition: flag(optimize)
        ghc-options: -O2
      - condition: flag(optimize-aggressively)
        ghc-options:
          - -O2
          - -fexpose-all-unfoldings
          - -flate-specialise
          - -flate-dmd-anal
          - -fstg-lift-lams

  # The vendored c-expr runtime (macro vocabulary), likewise private
  # and compiled with its upstream settings.
  cexpr-runtime:
    source-dirs: runtime-cexpr
    language: Haskell2010
    default-extensions:
      - DataKinds
      - DeriveGeneric
      - DeriveTraversable
      - DerivingStrategies
      - FlexibleInstances
      - GADTs
      - ImportQualifiedPost
      - LambdaCase
      - MagicHash
      - MultiParamTypeClasses
      - ParallelListComp
      - StandaloneKindSignatures
      - TupleSections
      - TypeApplications
      - TypeFamilies
      - TypeOperators
    dependencies:
      - base >=4.17 && <4.23
      - containers >=0.5 && <0.9
      - fin >=0.3.2 && <0.4
      - some >=1.0.6 && <1.1
      - template-haskell >=2.18 && <2.25
      - vec >=0.5 && <0.6
    when:
      - condition: flag(optimize)
        ghc-options: -O2
      - condition: flag(optimize-aggressively)
        ghc-options:
          - -O2
          - -fexpose-all-unfoldings
          - -flate-specialise
          - -flate-dmd-anal
          - -fstg-lift-lams

library:
  source-dirs: src
  pkg-config-dependencies:
    # mpv.pc's version is the client API version, not the mpv release.
    # Surface is generated from client API 2.5 (mpv 0.41.0); everything newer
    # than the consumer's libmpv is version-gated in the wrapper C on
    # MPV_CLIENT_API_VERSION (mpv_del_property stubs to MPV_ERROR_UNSUPPORTED,
    # mpv_get_time_ns falls back to mpv_get_time_us). Ubuntu 24.04 ships
    # client API 2.2 (mpv 0.37) as of writing.
    - mpv >= 2.0
  ghc-options:
    # libmpv releases may retype declarations ABI-compatibly (e.g. constify
    # a pointer parameter).
    #
    # The baked wrapper signatures would then differ textually from the
    # consumer's headers, and gcc >= 14 / clang >= 16 error out when this
    # happens.
    #
    # The ABI is observably unchanged, so we can demote these warnings.
    - -optc-Wno-incompatible-pointer-types
    - -optc-Wno-incompatible-function-pointer-types
  dependencies:
    - base >=4.17 && <4.23
    - bindgen-runtime
    - cexpr-runtime
  when:
    - condition: flag(abi-assertions)
      c-sources: cbits/abi_assertions.c
    - condition: flag(abi-assertions-exact)
      cc-options: -DLITHON_ABI_EXACT
    - condition: flag(strict-data)
      default-extensions: StrictData
    - condition: flag(strict)
      default-extensions: Strict
    - condition: flag(optimize)
      ghc-options: -O2
    - condition: flag(optimize-aggressively)
      ghc-options:
        - -O2
        - -fexpose-all-unfoldings
        - -flate-specialise
        - -flate-dmd-anal
        - -fstg-lift-lams
