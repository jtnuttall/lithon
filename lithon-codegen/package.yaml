name: lithon-codegen
version: 0.1.0.0
github: "jtnuttall/lithon"
license: BSD-3-Clause
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "(c) 2026 Jeremy Nuttall"
category: Graphics

synopsis: Code generator for lithon-vk and sdl3-bindgen-sys
description: Lithon's code generation tool. Lithon aims to be a performant, modern Vulkan binding amenable to type-level programming.

extra-source-files:
  - data/sdl3/static/*
  - data/sdl3/*.json
  - data/sdl3/overrides.yaml

extra-doc-files:
  - README.md
  - CHANGELOG.md

data-dir: data

language: GHC2024

default-extensions:
  - BlockArguments
  - DeriveAnyClass
  - DerivingVia
  - DuplicateRecordFields
  - NoFieldSelectors
  - NoImplicitPrelude
  - OverloadedLabels
  - OverloadedRecordDot
  - PatternSynonyms
  - RecordWildCards
  - TypeFamilies

ghc-options:
  - -Wmissing-deriving-strategies
  - -Wmissing-export-lists
  - -Wredundant-constraints
  - -Wall

dependencies:
  - base <4.22.0.0
  - lithon-hs-bindgen
  - lithon-prelude
  - doxygen-parser
  - typed-product-builder
  - aeson ^>=2.3
  - aeson-pretty ^>=0.8
  - algebraic-graphs ^>=0.8
  - ansi-terminal ^>=1.1
  - autodocodec ^>=0.5
  - barbies ^>=2.1
  - bifunctors ^>=5.6
  - Blammo ^>=2.1
  - bytestring ^>=0.12
  - case-insensitive ^>=1.2
  - concurrent-output ^>=1.10
  - conduit ^>=1.3
  - conduit-extra ^>=1.3
  - constraints-extras ^>=0.4
  - containers ^>=0.7
  - data-default ^>=0.8
  - data-fix ^>=0.3
  - deepseq ^>=1.5
  - dependent-map ^>=0.4
  - dependent-sum ^>=0.7
  - dependent-sum-template ^>=0.2
  - deriving-compat ^>=0.6
  - directory ^>=1.3
  - dlist ^>= 1.0
  - effectful ^>=2.6
  - effectful-core ^>=2.6
  - effectful-plugin ^>=2.1
  - extra ^>=1.8
  - file-embed >=0.0.16 && <0.0.17
  - filepath ^>=1.5
  - generic-lens ^>=2.3
  - generics-sop ^>=0.5
  - hashable ^>=1.5
  - hpack ^>=0.39
  - indexed-traversable ^>=0.1
  - lens ^>=5.3
  - megaparsec >=9.7
  - monad-logger-aeson ^>=0.4
  - monoidal-containers ^>=0.6
  - mtl ^>=2.3
  - neat-interpolation ^>=0.5
  - nonempty-containers ^>=0.3
  - optparse-applicative ^>=0.19
  - ordered-containers ^>=0.2
  - prettyprinter ^>=1.7
  - prettyprinter-ansi-terminal ^>=1.1
  - process ^>=1.6
  - typed-process ^>=0.2
  - profunctors ^>=5.6
  - rapidhash
  - recursion-schemes ^>=5.2
  - regex-tdfa ^>=1.3
  - resourcet-effectful ^>=1.0
  - scientific ^>=0.3
  - semialign ^>=1.4
  - singletons ^>=3.0
  - singletons-th ^>=3.5
  - tagged ^>=0.8
  - template-haskell
  - temporary ^>=1.3
  - text ^>=2.1
  - text-builder-linear ^>=0.1
  - text-display ^>=1.0
  - these ^>=1.2
  - transformers ^>=0.6
  - unliftio ^>=0.2
  - universum ^>=1.8
  - unordered-containers ^>=0.2
  - validation ^>=1.2
  - vector ^>=0.13
  - witch ^>=1.4
  - witherable ^>= 0.5
  - xml-conduit ^>=1.10
  - xml-types ^>=0.3

library:
  source-dirs: src

executables:
  lithon-codegen:
    main: Main.hs
    source-dirs: app
    dependencies:
      - lithon-codegen

tests:
  lithon-codegen-test:
    main: Driver.hs
    source-dirs: test
    ghc-options:
      - -Wno-missing-export-lists
    dependencies:
      - lithon-codegen
      - directory ^>=1.3
      - hedgehog ^>=1.7
      - tasty ^>=1.5
      - tasty-golden ^>=2.3
      - tasty-hedgehog ^>=1.4
      - tasty-hunit ^>=0.10
    build-tools:
      - tasty-discover:tasty-discover ^>=5.2
