author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "(c) 2026 Jeremy Nuttall"
category: Graphics
tested-with: GHC == 9.8.* || == 9.10.* || == 9.12.*

synopsis: Complete SDL3 bindings, raw + curated, generated by hs-bindgen
description: |
  Machine-generated low-level bindings to the whole SDL 3.4 API: the raw
  hs-bindgen output (@SDL3.Sys.Bindgen.*@) plus a curated @SDL3.Sys@ layer
  with per-function safe/unsafe FFI decisions, typed constants, and native
  Haskell scalars. SDL's own header documentation rides along in the
  haddocks.

  A generated translation unit of C @_Static_assert@s checks the baked
  layouts against your installed SDL at every build, so ABI divergence is
  a compile error rather than memory corruption.

  Supports 64-bit Linux, macOS, and Windows, with SDL >= 3.2 development
  headers present. See the README for a quick start and the list of
  deliberate omissions.

extra-doc-files:
  - README.md
  - CHANGELOG.md

language: GHC2021

flags:
  abi-assertions:
    description: |
      Verify the baked ABI layout against the system SDL3 headers at build time
      via generated C static assertions (disable only to diagnose)
    manual: true
    default: true
  strict-data:
    description: |
      Compile the generated modules with StrictData (strict fields on every generated
      record). Main library only; the vendored runtime keeps its upstream semantics.
      Disable if you need lazy fields.
    manual: true
    default: true
  strict:
    description: |
      EXPERIMENTAL: compile the generated modules with Strict.

      The emitted hs-bindgen code has not been audited for laziness dependence; main library only.

      NB: Implies StrictData (GHC semantics), so -f -strict-data does not undo strict fields.
    manual: true
    default: false
  optimize:
    description: |
      Build with -O2. Package ghc-options win over cabal's optimization setting, so use
      -f -optimize for faster iterative builds of this large package.
    manual: true
    default: true
  optimize-aggressively:
    description: |
      Build with expensive optimizations. Consider this the release build: slow, but paid once if
      caching is set up, so it may be worth it for artifacts you intend to ship.

      Currently: -O2 -fexpose-all-unfoldings -flate-specialise -flate-dmd-anal -fstg-lift-lams.
    manual: true
    default: false

# Vendored `hs-bindgen` runtime.
#
# Semantics-preserving flags like `optimize` flags are applied here.
# Semantics-wrecking flags like `strict` aren't.
#
# This is an internal, private package. The shim will be traded for
# a real dependency + re-export once hs-bindgen releases.
internal-libraries:
  bindgen-runtime:
    source-dirs: runtime
    default-extensions:
      - DataKinds
      - DefaultSignatures
      - DeriveAnyClass
      - DerivingStrategies
      - DerivingVia
      - FunctionalDependencies
      - LambdaCase
      - PatternSynonyms
      - RecordWildCards
      - RoleAnnotations
      - ScopedTypeVariables
      - TypeFamilies
      - UndecidableInstances
      - ViewPatterns
    dependencies:
      - base >=4.17 && <4.23
      - bytestring >=0.11 && <0.13
      - containers >=0.6 && <0.9
      - primitive >=0.9 && <0.10
      - record-hasfield >=1.0 && <2
      - template-haskell >=2.18 && <2.25
      - vector >=0.13 && <0.14
    build-tools:
      - hsc2hs:hsc2hs
    when:
      - condition: flag(optimize)
        ghc-options: -O2
      - condition: flag(optimize-aggressively)
        ghc-options:
          - -O2
          - -fexpose-all-unfoldings
          - -flate-specialise
          - -flate-dmd-anal
          - -fstg-lift-lams

  # The vendored c-expr runtime (macro vocabulary), likewise private
  # and compiled with its upstream settings.
  cexpr-runtime:
    source-dirs: runtime-cexpr
    language: Haskell2010
    default-extensions:
      - DataKinds
      - DeriveGeneric
      - DeriveTraversable
      - DerivingStrategies
      - FlexibleInstances
      - GADTs
      - ImportQualifiedPost
      - LambdaCase
      - MagicHash
      - MultiParamTypeClasses
      - ParallelListComp
      - StandaloneKindSignatures
      - TupleSections
      - TypeApplications
      - TypeFamilies
      - TypeOperators
    dependencies:
      - base >=4.17 && <4.23
      - containers >=0.5 && <0.9
      - fin >=0.3.2 && <0.4
      - some >=1.0.6 && <1.1
      - template-haskell >=2.18 && <2.25
      - vec >=0.5 && <0.6
    when:
      - condition: flag(optimize)
        ghc-options: -O2
      - condition: flag(optimize-aggressively)
        ghc-options:
          - -O2
          - -fexpose-all-unfoldings
          - -flate-specialise
          - -flate-dmd-anal
          - -fstg-lift-lams

library:
  source-dirs: src
  pkg-config-dependencies:
    # Surface is generated from 3.4.2; everything newer than the consumer's
    # SDL is version-gated in the wrapper C (SDL_SetError stubs) and the
    # assert TU, on SDL's own version macros. Debian stable ships 3.2.x as
    # of writing.
    - sdl3 >= 3.2
  ghc-options:
    # SDL patch releases may retype declarations ABI-compatibly
    # (3.4.2 -> 3.4.12 constified SDL_SetClipboardData's mime_types).
    #
    # This causes the baked wrapper signatures then differ textually from
    # newer headers, and gcc >= 14 / clang >= 16 error out when this happens.
    #
    # The ABI is observably unchanged, so we can demote these warnings.
    - -optc-Wno-incompatible-pointer-types
    - -optc-Wno-incompatible-function-pointer-types
  dependencies:
    - base >=4.17 && <4.23
    - bindgen-runtime
    - cexpr-runtime
  when:
    - condition: flag(abi-assertions)
      c-sources: cbits/abi_assertions.c
    - condition: flag(strict-data)
      default-extensions: StrictData
    - condition: flag(strict)
      default-extensions: Strict
    - condition: flag(optimize)
      ghc-options: -O2
    - condition: flag(optimize-aggressively)
      ghc-options:
        - -O2
        - -fexpose-all-unfoldings
        - -flate-specialise
        - -flate-dmd-anal
        - -fstg-lift-lams
