# Link checker configuration (`just links`; CI's `links` job).
# Needs the network, so this runs beside the flake checks, not inside them.

no_progress = true
format = "compact"
max_concurrency = 16
timeout = 20
max_retries = 2

# Only web links; `av://lavfi:...` in the mpv example is an mpv URL, not a web one.
scheme = ["https", "http"]
exclude_all_private = true

exclude_path = [
  # third-party trees
  "lithon-codegen/data/vulkan/Vulkan-Docs",
  "lithon-hs-bindgen/vendor",
  # generated output: the codegen pins its reference URLs (and the Khronos
  # refpage prefix below would be checked thousands of times)
  "lithon-vk",
  "sdl3-bindgen-sys",
  "mpv-bindgen-sys",
  "dist-newstyle",
  # Holds an mpv `av://lavfi:...` URL that lychee rejects at parse time,
  # before `scheme` or `exclude` can apply.
  "lithon-examples/app/mpv-headless/Main.hs",
]

exclude = [
  # Nix binary caches serve nothing at their root.
  "^https://cache\\.(iog\\.io|zw3rk\\.com)/",
  "^https://[^/]+\\.cachix\\.org/",
  # URL prefixes the codegen completes at run time; the bare prefix 404s/403s.
  "^https://wiki\\.libsdl\\.org/SDL3/Category$",
  "^https://registry\\.khronos\\.org/vulkan/specs/latest/man/html/$",
  # Not yet released on Hackage; the README's link is forward-looking.
  "^https://hackage\\.haskell\\.org/package/rapidhash-aeson$",
]
