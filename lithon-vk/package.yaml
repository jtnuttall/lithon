name: lithon-vk
version: 0.1.0.0
github: "jtnuttall/lithon"
license: BSD-3-Clause
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "(c) 2026 Jeremy Nuttall"
category: Graphics

synopsis: Alternative Vulkan bindings for Haskell
description: |
  A modern (Vulkan 1.3+), curated Vulkan binding: type-level-friendly enums
  with open decoding, phantom-typed flag sets, sType/pNext chains over
  sop-core, arena-based marshalling, and never-throwing result plumbing.
  Everything under @src@ is generated by lithon-codegen from the pinned
  Vulkan registry — do not edit by hand; see the repository README.

extra-doc-files:
  - README.md
  - CHANGELOG.md

language: GHC2024

default-extensions:
  - BlockArguments
  - DataKinds
  - DerivingVia
  - DuplicateRecordFields
  - NoFieldSelectors
  - OverloadedRecordDot
  - PatternSynonyms
  - TypeFamilies

ghc-options:
  - -Wmissing-deriving-strategies
  - -Wredundant-constraints
  - -Wall

dependencies:
  - base <4.22.0.0
  - bytestring ^>=0.12
  - lithon-core
  - primitive ^>=0.9
  - sop-core ^>=0.5
  - these ^>=1.2
  - unliftio-core ^>=0.2
  - vector ^>=0.13
  - vector-sized ^>=1.6
  - witch ^>=1.4

library:
  source-dirs: src
