name: typed-product-builder
version: 0.1.0.0
github: "jtnuttall/lithon"
license: BSD-3-Clause
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "(c) 2026 Jeremy Nuttall"
category: Data

synopsis: Typed builder for products using generic-lens and generics-sop
description: |
  A type-level product/record-builder experiment over generic-lens and
  generics-sop. Not built for high-performance paths — the representation
  would need to be array-backed (a-la ARec) first — but fine for CLI
  tooling and run-once setup code. Internal to lithon and unpublished.

extra-doc-files:
  - README.md
  - CHANGELOG.md

language: GHC2024

default-extensions:
  - BlockArguments
  - DeriveAnyClass
  - DuplicateRecordFields
  - NoFieldSelectors
  - OverloadedLabels
  - OverloadedRecordDot
  - RecordWildCards

ghc-options:
  - -Wmissing-deriving-strategies
  - -Wmissing-export-lists
  - -Wredundant-constraints
  - -Wall
  - -Werror

dependencies:
  - base <4.22.0.0
  - constraints-extras ^>=0.4
  - deepseq ^>=1.5
  - first-class-families ^>=0.8
  - generic-lens ^>=2.3
  - generics-sop ^>=0.5
  - lens ^>=5.3
  - profunctors ^>=5.6
  - tagged ^>=0.8
  - vector ^>=0.13
  - witch ^>=1.4

library:
  source-dirs: src

tests:
  typed-product-builder-test:
    main: Driver.hs
    source-dirs: test
    dependencies:
      - typed-product-builder
      - hedgehog ^>=1.7
      - tasty ^>=1.5
      - tasty-hedgehog ^>=1.4
      - tasty-hunit ^>=0.10
    build-tools:
      - tasty-discover:tasty-discover ^>=5.2
