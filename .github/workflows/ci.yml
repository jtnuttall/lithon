# CI here has two important jobs:
# 1. Verify compilation of lithon's libraries across GHC versions, Cabal
#    flags, and supported platforms. The GHC and flag coverage lives in the
#    flake (the `check` job); the cabal jobs build each released
#    package from its sdist, as a consumer would, on every platform.
# 2. SDL3 and libmpv: Check ABI validity on supported platforms. Building
#    `sdl3-bindgen-sys` or `mpv-bindgen-sys` entails compiling
#    `abi_assertions.c`, which contains static assertions pinning the
#    expected ABI sizes and alignments.
name: lithon-ci

on:
  pull_request:
  push:
    branches: [main, dev, next]

# One run per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SDL_VERSION: "3.4.18"
  GHC_VERSION: "9.12.4"
  CABAL_VERSION: "3.18"

jobs:
  consumer-sdl3-bindgen-sys:
    if: github.repository == 'jtnuttall/lithon'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          release: false
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-pkgconf

      - uses: ./.github/actions/setup-sdl3
        with:
          version: ${{ env.SDL_VERSION }}

      - uses: ./.github/actions/setup-haskell
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      - name: Build and haddock from sdist
        shell: bash
        run: just sdist-consumer sdl3-bindgen-sys sdl3

  consumer-mpv-bindgen-sys:
    if: github.repository == 'jtnuttall/lithon'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2

      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev

      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv pkgconf

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          release: false
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-pkgconf

      - uses: ./.github/actions/setup-haskell
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      - name: Build and haddock from sdist
        shell: bash
        run: just sdist-consumer mpv-bindgen-sys mpv

  consumer-rapidhash:
    if: github.repository == 'jtnuttall/lithon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2

      - uses: ./.github/actions/setup-haskell
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      # The C reference pin and the other GHCs run hermetically in the nix
      # `check` jobs; doctest can't (doctest-parallel under haskell.nix).
      - name: Build, test, doctest, haddock, check from the sdists
        run: just rapidhash-sdist

  sdl3-shmup-smoke:
    if: github.repository == 'jtnuttall/lithon'
    # SDL 3.2.0 no longer compiles against PipeWire headers as of 2026-11-20 at latest
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sdl: ["3.2.0", "3.4.10", "3.4.16"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev

      - uses: ./.github/actions/setup-sdl3
        id: sdl
        with:
          version: ${{ matrix.sdl }}

      - uses: ./.github/actions/setup-haskell
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false
          dist-key: sdl-${{ steps.sdl.outputs.key }}

      - name: Build the shmup closure against SDL ${{ matrix.sdl }}
        run: |
          version=$(pkg-config --modversion sdl3)
          echo "sdl3: $version"
          [ "$version" = "${{ matrix.sdl }}" ] || { echo "resolved the wrong SDL"; exit 1; }
          cat > cabal.project.shmup <<'EOF'
          packages:
            sdl3-bindgen-sys
            lithon-core
            lithon-vk
            lithon-examples
          index-state: 2026-07-01T00:00:00Z
          package lithon-examples
            flags: -sdl -mpv
          EOF
          cabal update --project-file=cabal.project.shmup
          cabal build --project-file=cabal.project.shmup lithon-examples:exe:shmup

      - name: Run shmup headless
        run: |
          SDL_VIDEODRIVER=offscreen \
            cabal run -v0 --project-file=cabal.project.shmup \
            lithon-examples:exe:shmup -- --frames 60

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: lychee
        run: nix shell --inputs-from . nixpkgs#just nixpkgs#lychee -c just links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A GHC that has left the IOG / zw3rk caches would get built from source
    # here; fail instead, and drop it from the supported set.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules
        run: git submodule update --init --recursive --filter=tree:0
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            substituters = https://cache.nixos.org https://cache.iog.io https://cache.zw3rk.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=
      - uses: cachix/cachix-action@v17
        with:
          name: jtnuttall
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pushFilter: "(-source$|\\.tar\\.gz$|\\.drv$)"
      - name: just check
        run: |
          nix shell --inputs-from . nixpkgs#just nixpkgs#nix-fast-build -c \
            just check --no-nom --skip-cached --max-jobs 2 --option cores 2
