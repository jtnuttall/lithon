name: "Setup Haskell and Cache"
description: "Configures GHC/Cabal and caches the Cabal store and local dist folder"

inputs:
  ghc-version:
    description: "The GHC version to install"
    required: true
  cabal-version:
    description: "The Cabal version to install"
    required: true
  cabal-update:
    description: "If set to false, skip cabal update step."
    required: false
    default: false
  dist-key:
    description: "Extra cache-key component for dist-newstyle, for builds whose outputs embed something outside the repo (a C library's install prefix, say)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Haskell
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ inputs.ghc-version }}
        cabal-version: ${{ inputs.cabal-version }}
        cabal-update: ${{ inputs.cabal-update }}

    - name: Cache the cabal store
      uses: actions/cache@v4
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ runner.os }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-store-${{ hashFiles('**/*.cabal', '**/cabal.project.freeze') }}
        restore-keys: |
          ${{ runner.os }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-store-

    - name: Cache dist-newstyle
      uses: actions/cache@v4
      with:
        path: dist-newstyle
        key: ${{ runner.os }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-dist-${{ inputs.dist-key }}-${{ hashFiles('**/*.cabal', '**/cabal.project.freeze') }}
        restore-keys: |
          ${{ runner.os }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-dist-${{ inputs.dist-key }}-
