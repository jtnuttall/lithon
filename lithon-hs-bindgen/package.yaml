name: lithon-hs-bindgen
version: 0.1.0.0
github: "jtnuttall/lithon"
license: BSD-3-Clause
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "(c) 2026 Jeremy Nuttall"
category: Graphics

synopsis: Curated hs-bindgen surface for lithon
description: |
  The only lithon package permitted to build-depend on the vendored
  hs-bindgen (lithon-hs-bindgen/vendor/). The adapter seam: lithon-owned
  invocation records and artefact operations (Lithon.HsBindgen.Invoke),
  AST-level module transforms (Lithon.HsBindgen.Transform), and curated
  qualified facades over the AST vocabularies the emitters consume. On a
  vendor bump, this package breaks so the rest of lithon does not.

extra-doc-files:
  - README.md
  - CHANGELOG.md

language: GHC2024

data-dir: vendor

default-extensions:
  - BlockArguments
  - OverloadedRecordDot
  - RecordWildCards

ghc-options:
  - -Wmissing-deriving-strategies
  - -Wmissing-export-lists
  - -Wredundant-constraints
  - -Wall

dependencies:
  - base <4.22.0.0
  - doxygen-parser
  - hs-bindgen
  - libclang-bindings
  - lithon-prelude
  - bytestring
  - debruijn
  - data-default
  - file-embed
  - filepath
  - lens
  - mtl
  - text
  - text-builder-linear

library:
  source-dirs: src
